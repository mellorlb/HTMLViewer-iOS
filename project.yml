name: HTMLViewer
options:
  bundleIdPrefix: com.htmlviewer
  deploymentTarget:
    iOS: '17.0'
  xcodeVersion: '26.0'
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: '5.0'
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    TARGETED_DEVICE_FAMILY: '1,2'
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    exactVersion: 0.9.20
targets:
  HTMLViewer:
    type: application
    platform: iOS
    deploymentTarget: '17.0'
    sources:
      - path: HTMLViewer
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.htmlviewer.fastviewer
        PRODUCT_NAME: HTMLViewer
        INFOPLIST_FILE: HTMLViewer/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_EMIT_LOC_STRINGS: YES
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Manual
    dependencies:
      - package: ZIPFoundation
    scheme:
      gatherCoverageData: false
